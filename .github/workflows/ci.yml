name: CI and Docker images

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get project files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: python3 run-tests.py

      - name: Summarize test results
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results/junit.xml")
          try:
              suite = ET.parse(report).getroot()
          except (OSError, ET.ParseError):
              content = "## Résultats des tests\n\nAucun rapport JUnit disponible.\n"
          else:
              content = (
                  "## Résultats des tests\n\n"
                  f"- Tests : {suite.get('tests', '?')}\n"
                  f"- Échecs : {suite.get('failures', '?')}\n"
                  f"- Erreurs : {suite.get('errors', '?')}\n"
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(content)
          PY

      - name: Upload JUnit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-results
          path: test-results/junit.xml
          if-no-files-found: warn

  build:
    name: Build and publish image
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'branch' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_digest: ${{ steps.publish.outputs.digest }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Get project files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set image tag
        id: image
        run: |
          branch=$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//')
          branch=${branch:-branch}
          # A Docker tag fits 87 branch characters, one hyphen and the 40-character SHA.
          tag="${branch:0:87}-$GITHUB_SHA"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'repository=%s\nref=%s:%s\n' "$repository" "$repository" "$tag" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE" .

      - name: Publish image to GHCR
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$IMAGE"
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE")
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "The published image digest is missing or invalid." >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '### Docker image published on GHCR\n\n%s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    concurrency:
      group: semantic-release-main
      cancel-in-progress: false

    steps:
      - name: Get Git history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: npm

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - name: Release with semantic-release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
          RELEASE_IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          npm run release
